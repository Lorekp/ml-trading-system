<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Backtest Dashboard — BTC vol-arb</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0b1017; --bg-2:#0f1620; --panel:#111a24; --panel-2:#152030;
    --rule:#1d2a3a; --rule-2:#273648;
    --ink:#e5ecf5; --ink-2:#aab6c4; --muted:#6b7886; --dim:#4a5968;
    --accent:#14b8a6; --accent-2:#8b5cf6;
    --pos:#22c55e; --neg:#ef4444; --warn:#f59e0b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-feature-settings:"tnum" 1;font-size:13px}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
  button{font-family:inherit;cursor:pointer}
  /* header */
  header.top{position:sticky;top:0;z-index:20;background:color-mix(in oklab,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);padding:10px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:24px}
  header.top h1{font-weight:500;margin:0;font-size:14px;letter-spacing:0.02em}
  header.top h1 .dim{color:var(--muted);font-weight:300}
  header.top .sub{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.12em;margin-top:4px}
  header.top .meta{font-size:10px;color:var(--muted);text-align:right;font-family:"IBM Plex Mono",monospace;letter-spacing:0.05em}
  header.top .pill{display:inline-block;padding:2px 8px;border:1px solid var(--rule-2);color:var(--accent);margin-left:6px}
  /* controls bar */
  .ctrls{display:flex;align-items:stretch;gap:18px;padding:10px 20px;border-bottom:1px solid var(--rule);background:var(--bg-2);position:sticky;top:48px;z-index:19;overflow-x:auto;scrollbar-width:thin}
  .ctrls .c{display:flex;flex-direction:column;gap:4px;min-width:max-content}
  .ctrls .lbl{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase}
  .seg{display:inline-flex;border:1px solid var(--rule-2);border-radius:2px;overflow:hidden;height:26px}
  .seg button{background:transparent;border:0;padding:0 10px;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted)}
  .seg button:hover{color:var(--ink-2)}
  .seg button.on{background:var(--accent);color:#0b1017;font-weight:500}
  /* date range - mini brush */
  .daterange{height:26px;width:240px;position:relative;border:1px solid var(--rule-2);border-radius:2px;overflow:hidden;background:#0b1017}
  .daterange svg{width:100%;height:100%;display:block}
  .daterange .handle{position:absolute;top:0;bottom:0;width:6px;background:var(--accent);cursor:ew-resize;z-index:2}
  .daterange .sel{position:absolute;top:0;bottom:0;background:rgba(20,184,166,0.15);pointer-events:none}
  .daterange-label{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-2);margin-left:4px}
  /* slider */
  input[type=range]{appearance:none;height:4px;background:var(--rule-2);border-radius:2px;outline:none;accent-color:var(--accent);width:120px}
  input[type=range]::-webkit-slider-thumb{appearance:none;width:12px;height:12px;background:var(--accent);border-radius:50%;cursor:pointer}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;background:var(--accent);border-radius:50%;border:none}
  /* tabs */
  nav.tabs{display:flex;gap:0;padding:0 18px;border-bottom:1px solid var(--rule);background:var(--bg);position:sticky;top:96px;z-index:18}
  nav.tabs button{background:transparent;border:0;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;padding:12px 16px;color:var(--muted);border-bottom:1px solid transparent;margin-bottom:-1px;transition:color 120ms}
  nav.tabs button:hover{color:var(--ink-2)}
  nav.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
  nav.tabs .num{opacity:0.55;margin-right:10px}
  main{padding:16px 20px 80px}
  /* panel */
  .panel{background:var(--panel);border:1px solid var(--rule);border-radius:2px;margin-bottom:14px}
  .panel-hdr{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 14px 8px;border-bottom:1px solid var(--rule)}
  .panel-title{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink);letter-spacing:0.1em;text-transform:uppercase;font-weight:500}
  .panel-sub{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted);letter-spacing:0.04em;text-align:right}
  .panel-sub .accent{color:var(--accent)}
  .panel-body{padding:12px 14px}
  .panel-body.tight{padding:8px 10px}
  /* grid layout helpers */
  .grid{display:grid;gap:12px}
  .grid-3{grid-template-columns:repeat(3,1fr)}
  .grid-2{grid-template-columns:2fr 1fr}
  /* stat cell */
  .stat{display:flex;flex-direction:column;padding:10px 12px;border-right:1px solid var(--rule);min-width:0}
  .stat:last-child{border-right:none}
  .stat .lbl{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase}
  .stat .val{font-family:"IBM Plex Mono",monospace;font-size:22px;color:var(--ink);letter-spacing:-0.01em;margin-top:4px;line-height:1}
  .stat .val.pos{color:var(--pos)} .stat .val.neg{color:var(--neg)}
  .stat .ci{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--muted);margin-top:3px}
  .stat .n{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--dim);margin-top:1px}
  /* stats table (right col overview) */
  .stat-table{display:flex;flex-direction:column;padding:4px 12px}
  .stat-table .row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule);align-items:baseline}
  .stat-table .row:last-child{border-bottom:none}
  .stat-table .row .k{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em}
  .stat-table .row .v{font-family:"IBM Plex Mono",monospace;font-size:14px;color:var(--ink);text-align:right}
  .stat-table .row .ci{grid-column:1/-1;font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--muted);margin-top:-4px}
  /* chart defaults */
  svg.chart{width:100%;display:block}
  svg.chart text{font-family:"IBM Plex Mono",monospace;fill:var(--ink-2);font-size:9.5px}
  svg.chart text.axis{fill:var(--muted);font-size:9px}
  /* tooltip */
  .tip{position:fixed;pointer-events:none;z-index:50;background:var(--panel-2);border:1px solid var(--rule-2);border-radius:2px;padding:8px 10px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink);box-shadow:0 8px 24px rgba(0,0,0,0.4);min-width:160px}
  .tip .tk{color:var(--muted);margin-right:10px}
  .tip .tv{color:var(--ink);float:right}
  .tip .th{font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:4px;border-bottom:1px solid var(--rule);padding-bottom:4px}
  /* legend chip */
  .chip{display:inline-flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-2);margin-right:14px}
  .chip .sw{width:12px;height:2px;display:inline-block}
  .chip .sw.dash{background:repeating-linear-gradient(90deg,currentColor 0 4px,transparent 4px 7px)}
  /* episodes table */
  .etable{width:100%;border-collapse:collapse;font-family:"IBM Plex Mono",monospace;font-size:10.5px}
  .etable thead th{text-align:right;padding:8px 8px;font-weight:500;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;font-size:9.5px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--panel);cursor:pointer;user-select:none}
  .etable thead th:first-child,.etable tbody td:first-child{text-align:left}
  .etable thead th.sort-asc::after{content:" ↑";color:var(--accent)}
  .etable thead th.sort-desc::after{content:" ↓";color:var(--accent)}
  .etable tbody td{padding:6px 8px;text-align:right;border-bottom:1px solid rgba(29,42,58,0.5);color:var(--ink-2);white-space:nowrap}
  .etable tbody tr{cursor:pointer}
  .etable tbody tr:hover{background:rgba(20,184,166,0.06)}
  .etable tbody tr.selected{background:rgba(20,184,166,0.14)}
  .etable tbody tr.selected td{color:var(--ink)}
  .side-l{color:var(--accent)} .side-s{color:var(--accent-2)}
  .pos{color:var(--pos)} .neg{color:var(--neg)}
  /* scroll container */
  .scroll{overflow:auto;max-height:640px;scrollbar-width:thin}
  .scroll::-webkit-scrollbar{width:8px;height:8px}
  .scroll::-webkit-scrollbar-thumb{background:var(--rule-2);border-radius:4px}
  /* tweaks */
  .tweaks{position:fixed;right:16px;bottom:16px;z-index:40;background:var(--panel-2);border:1px solid var(--rule-2);border-radius:2px;padding:12px 14px;display:none;flex-direction:column;gap:10px;min-width:240px;font-family:"IBM Plex Mono",monospace;box-shadow:0 10px 30px rgba(0,0,0,0.4)}
  .tweaks.on{display:flex}
  .tweaks h4{margin:0 0 2px;font-family:"IBM Plex Sans",sans-serif;font-size:12px;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink)}
  .tweaks .t-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .tweaks .t-row label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em}
  /* mode banner */
  .mode-banner{display:inline-flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--accent);padding:2px 8px;border:1px solid color-mix(in oklab,var(--accent) 40%,var(--rule-2));border-radius:2px}
  /* crosshair line */
  .crosshair-v{stroke:var(--accent);stroke-width:0.8;pointer-events:none;opacity:0.6}
  /* drop-cap number on tab title */
  .tab-head{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}
  .tab-head .num{font-family:"IBM Plex Mono",monospace;color:var(--accent);font-size:11px;letter-spacing:0.1em}
  .tab-head h2{margin:0;font-weight:500;font-size:15px;letter-spacing:0.02em}
  .tab-head .desc{font-size:11px;color:var(--muted);margin-left:auto;font-family:"IBM Plex Mono",monospace}
  /* loading + error */
  .loading{padding:80px;text-align:center;font-family:"IBM Plex Mono",monospace;color:var(--muted);font-size:12px}
  .loading .pulse{display:inline-block;width:8px;height:8px;background:var(--accent);border-radius:50%;animation:pulse 1.2s ease-in-out infinite;margin-right:8px}
  @keyframes pulse{0%,100%{opacity:0.3}50%{opacity:1}}
</style>
</head>
<body>
  <div id="root"></div>
  <div id="tip" class="tip" style="display:none"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
