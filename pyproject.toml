[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-trading-system"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "aiohttp>=3.9",
    "aiosqlite>=0.19",
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "python-dotenv>=1.0",
]
full = [
    "lightgbm>=4.0",
    "optuna>=3.0",
    "xgboost>=2.0",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "lz4>=4.0",
    "requests>=2.31",
]
live = [
    "aiohttp>=3.9",
    "aiosqlite>=0.19",
    "python-dotenv>=1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "deribit_paper/tests"]
pythonpath = ["src", "."]
addopts = "-m 'not integration and not slow'"
markers = [
    "slow: marks tests that take >30 seconds",
    "integration: marks tests that require local data, models, or cached artifacts",
]
asyncio_mode = "auto"
