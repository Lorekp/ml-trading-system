# Historical prop-firm research profile
# Preserved for provenance only. The profile and its former performance claims
# are not validated and must not be used for a funded challenge.

model:
  type: logreg_l1
  C: 0.01
  solver: saga
  max_iter: 1000
  random_state: 42
  features: all_18  # full feature list, L1 selects
  lookback_months: 14
  fwd_bars: 4
  retrain: monthly

signal:
  confidence_threshold: 0.25  # absolute |prob - 0.5|
  confidence_mode: absolute
  vol_filter_quantile: 0.50
  step_size: 0.1

portfolio:
  starting_capital: 10000.0
  base_sizing_pct: 0.21  # ~5.2x leverage (0.04 * 5.2)
  max_signal_mult: 2.0
  max_exposure: 0.90
  max_per_asset: 0.05
  slippage: 0.0001
  max_dd: 0.10  # prop firm limit
  delever_start: 0.08  # start reducing at 8%

risk:
  daily_loss_halt_pct: 4.0  # halt if daily loss > 4% (under 5% limit)
  total_dd_reduce_pct: 8.0  # reduce leverage 50% at 8% DD
  max_leverage: 5.2

assets:
  # Historical 30-asset research universe.
  - BTC
  - ETH
  - SOL
  - XRP
  - ZEC
  - BNX
  - BNB
  - ENJ
  - TAO
  - ADA
  - ANKR
  - SUI
  - AVAX
  - LINK
  - NEAR
  - FIL
  - DOT
  - SXP
  - ENA
  - BCH
  - LTC
  - UNI
  - WLD
  - TRX
  - FTM
  - AAVE
  - FET
  - APT
  - HBAR
  - XLM
