# Live MEXC Trading Configuration
# ================================
# Production config with REAL order execution.
# Secrets injected from environment variables:
#   MEXC_API_KEY, MEXC_API_SECRET, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
#
# WARNING: This config places REAL orders with REAL money.

signal:
  model:
    C: 0.1
    penalty: "l1"
    solver: "saga"
    max_iter: 1000
    seed: 42
    fwd_bars: 4

  features:
    feature_list:
      - ret_1
      - ret_3
      - ret_7
      - ret_14
      - bar_range
      - vol_zscore
      - rsi_14
      - stoch_rsi
      - macd_hist
      - bb_pct_b
      - atr_14
      - dist_swing_high
      - dist_swing_low
    winsor_lo: 0.01
    winsor_hi: 0.99
    vol_filter_quantile: 0.50
    vol_zscore_window: 30
    swing_lookback: 20

  portfolio:
    starting_capital: 10000.0
    max_dd: 0.15
    delever_start: 0.075
    slippage: 0.0001
    max_exposure: 0.80
    max_per_asset: 0.06
    base_sizing_pct: 0.02
    max_signal_mult: 2.0

  regime_filter:
    enabled: false
    timeframe: "4h"
    ema_span: 20

  confidence_filter:
    mode: "absolute"
    threshold: 0.08

  signal:
    step_size: 0.1

  data:
    data_dirs:
      - "data/binance-1m"
      - "data/homeserver-mirror/binance-1m"
    timeframe: "15min"
    regime_timeframe: "4h"

  assets:
    BTC: "BTCUSDT"
    ETH: "ETHUSDT"
    XRP: "XRPUSDT"
    BNB: "BNBUSDT"
    SUI: "SUIUSDT"
    LINK: "LINKUSDT"

exchange:
  name: "mexc"
  base_url: "https://futures.mexc.com"
  ws_url: "wss://contract.mexc.com/edge"
  rate_limit_per_sec: 20
  timeout_s: 10.0

telegram:
  enabled: true
  notify_on:
    - signal
    - trade
    - error
    - daily
    - startup

paper:
  slippage_bps: 1.0
  starting_capital: 10000.0

scheduler:
  bar_interval_m: 15
  poll_offset_s: 5
  retry_count: 3
  retry_delay_s: 2.0

risk:
  max_positions: 6
  max_per_asset_pct: 0.06
  max_total_exposure_pct: 0.80
  daily_dd_halt_pct: 0.05
  confidence_threshold: 0.08
  hold_bars: 4
  base_sizing_pct: 0.02
  max_signal_mult: 2.0
  stop_loss_pct: 0.0               # DISABLED — experiment showed 2% SL costs 0.5 Sharpe
  stop_loss_max_wait_s: 300

# LIVE MODE ENABLED
live_mode:
  enabled: true

circuit_breakers:
  drawdown_halt_pct: 0.15
  api_error_limit: 5
  api_error_window_m: 10
  api_error_recovery_m: 30
  position_mismatch_pct: 0.10
  kill_switch_path: "KILL"
  reconcile_interval_bars: 4

db_path: "data/live/live_state.db"
log_level: "INFO"

assets:
  BTC: "BTCUSDT"
  ETH: "ETHUSDT"
  XRP: "XRPUSDT"
  BNB: "BNBUSDT"
  SUI: "SUIUSDT"
  LINK: "LINKUSDT"
