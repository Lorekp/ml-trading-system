# HyroTrader Risk Profile Override
# ==================================
# Conservative settings for HyroTrader vault compatibility:
# - 25% max exposure
# - 4 positions max
# - 5-min stop-loss timeout
# - Higher confidence threshold
#
# Historical paper-risk override for live_paper.yaml.

risk:
  max_positions: 4
  max_per_asset_pct: 0.06
  max_total_exposure_pct: 0.25
  daily_dd_halt_pct: 0.05
  confidence_threshold: 0.12
  hold_bars: 4
  base_sizing_pct: 0.015
  max_signal_mult: 1.5
  stop_loss_pct: 0.02
  stop_loss_max_wait_s: 300

circuit_breakers:
  drawdown_halt_pct: 0.10
  api_error_limit: 3
  api_error_window_m: 10
  api_error_recovery_m: 30
  position_mismatch_pct: 0.05
  kill_switch_path: "KILL"
  reconcile_interval_bars: 2
