# Historical HyroTrader/Bybit paper profile
# ==========================================
# Phase 1: 10% profit target, 10% max DD (EOD), 5% daily DD
# Mandatory stop-loss within 5 min, 40% consistency, 3% risk/trade
#
# Preserved for research provenance. It is not validated for a funded
# challenge or real orders.
#
# Secrets from env: BYBIT_API_KEY, BYBIT_API_SECRET,
#                   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID

signal:
  model:
    C: 0.01
    penalty: "l1"
    solver: "saga"
    max_iter: 1000
    seed: 42
    fwd_bars: 4

  features:
    feature_list:
      - ret_1
      - ret_3
      - ret_7
      - ret_14
      - bar_range
      - vol_zscore
      - rsi_14
      - stoch_rsi
      - macd_hist
      - bb_pct_b
      - atr_14
      - dist_swing_high
      - dist_swing_low
      - entropy
      - parkinson_vol_20
      - cs_spread
      - ffd_close
      - ffd_ret_1
    winsor_lo: 0.01
    winsor_hi: 0.99
    vol_filter_quantile: 0.50
    vol_zscore_window: 30
    swing_lookback: 20
    fracdiff_d: 0.4
    fracdiff_threshold: 0.001

  portfolio:
    starting_capital: 10000.0
    max_dd: 0.10
    delever_start: 0.08
    slippage: 0.0001
    max_exposure: 0.25
    max_per_asset: 0.05
    base_sizing_pct: 0.04
    max_signal_mult: 2.0

  regime_filter:
    enabled: false

  confidence_filter:
    mode: "absolute"
    threshold: 0.14

  signal:
    step_size: 0.1

  data:
    data_dirs:
      - "data/binance-1m"
      - "data/homeserver-mirror/binance-1m"
    timeframe: "15min"
    regime_timeframe: "4h"

exchange:
  name: "mexc"
  base_url: "https://futures.mexc.com"
  # Historical paper data feed only; no real-order configuration is shipped.
  rate_limit_per_sec: 20
  timeout_s: 10.0

telegram:
  enabled: true
  notify_on:
    - error
    - daily

paper:
  slippage_bps: 5.0
  starting_capital: 10000.0

scheduler:
  bar_interval_m: 15
  poll_offset_s: 5
  retry_count: 3
  retry_delay_s: 2.0

risk:
  max_positions: 6
  max_per_asset_pct: 0.05
  max_total_exposure_pct: 0.25    # HyroTrader: 25% max single exposure
  daily_dd_halt_pct: 0.04         # halt at 4% (under 5% HyroTrader limit)
  confidence_threshold: 0.14
  hold_bars: 4
  base_sizing_pct: 0.04
  max_signal_mult: 2.0
  leverage: 2                      # ~1.7x rounded up for margin
  stop_loss_pct: 0.0              # disabled — using ATR stops instead
  stop_loss_max_wait_s: 300       # 5 min timeout for stop placement

live_mode:
  enabled: false                   # must remain disabled

circuit_breakers:
  drawdown_halt_pct: 0.09         # halt at 9% (under 10% HyroTrader limit)
  api_error_limit: 3
  api_error_window_m: 10
  api_error_recovery_m: 30
  position_mismatch_pct: 0.05
  kill_switch_path: "KILL"
  reconcile_interval_bars: 2
  rolling_sharpe_window_days: 20
  rolling_sharpe_alert_threshold: 1.0
  rolling_sharpe_halt_threshold: 0.0

db_path: "data/live/hyrotrader_state.db"
log_level: "INFO"

# HyroTrader-specific rules
hyrotrader:
  initial_balance: 10000
  consistency_rule_pct: 0.40      # no trade > 40% of total profit
  max_risk_per_trade_pct: 0.03    # 3% of initial balance
  atr_stop_mult: 3.0              # 3x ATR stop distance

# Historical strategy parameters from the v6 research sweep.
strategies:
  logreg_15m:
    class: "live.strategies.logreg.LogRegStrategy"
    enabled: true
    timeframes: ["15m"]
    max_positions: 8
    max_exposure_pct: 0.90
    base_sizing_pct: 0.30          # 5x leverage via aggressive sizing (0.06 * 5.0)
    max_signal_mult: 3.0
    hold_bars: 6
    stop_loss_pct: 0.0
    # Per-asset walk-forward params (T1 optimal)
    C: 0.02
    lookback_months: 2             # short lookback — adapts fast to regime
    confidence_threshold: 0.10
    vol_filter_quantile: 0.50
    close_rule: "fixed"            # hold to expiry (no early exit)
    fwd_bars: 6                    # 1.5 hour hold

# Top 30 assets available on both Bybit and Binance
assets:
  BTC: BTCUSDT
  ETH: ETHUSDT
  SOL: SOLUSDT
  XRP: XRPUSDT
  BNB: BNBUSDT
  ADA: ADAUSDT
  AVAX: AVAXUSDT
  LINK: LINKUSDT
  DOT: DOTUSDT
  SUI: SUIUSDT
  NEAR: NEARUSDT
  LTC: LTCUSDT
  BCH: BCHUSDT
  UNI: UNIUSDT
  AAVE: AAVEUSDT
  FIL: FILUSDT
  APT: APTUSDT
  FET: FETUSDT
  ENA: ENAUSDT
  HBAR: HBARUSDT
