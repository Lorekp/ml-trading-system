# Homeserver Paper Trader — Binance Futures data, simulated execution
# ====================================================================
# Same S8+Sym1.5 config as paper_bybit.yaml but uses Binance Futures
# for ALL market data (klines, tickers, volume). This matches the
# training data source exactly, eliminating vol_zscore divergence.
#
# Binance fapi endpoints are public — no auth needed.
# Paper mode: no real orders, local position simulation.

exchange:
  name: "binance"
  demo: false
  base_url: "https://fapi.binance.com"
  api_key: ""
  rate_limit_per_sec: 5
  timeout_s: 10.0
  quote_currency: "USDT"

capital: 200000
model_dir: "data/live/models"
leverage: 4

full5:
  - {tf: "15m", hold: 2,  resample: "15min", lookback: 200}
  - {tf: "1h",  hold: 4,  resample: "1h",    lookback: 100}
  - {tf: "3h",  hold: 16, resample: "3h",    lookback: 200}
  - {tf: "4h",  hold: 6,  resample: "4h",    lookback: 200}
  - {tf: "24h", hold: 12, resample: "1D",    lookback: 200}

mkrtk60:
  maker_wait_s: 0
  poll_interval_s: 5.0
  max_retries: 2

breaker:
  type: "pnl_ratio_symmetric"
  window: 10
  threshold: -0.01
  floor: 0.10
  up_threshold: 0.01
  cap: 1.5

portfolio:
  max_dd: 0.10
  delever_start: 0.05
  max_exposure: 0.90
  max_per_asset: 0.25
  max_per_strategy: 0.50
  max_positions_per_strategy: 20
  base_sizing_pct: 0.300
  max_signal_mult: 2.0
  sizing_mode: "probability_edge"
  regime_exposure_floor: 0.50

s8:
  core: [BTC, ETH, XRP, ADA, LINK, LTC, BNB, BCH, ETC]
  max_total: 30
  btc_vol_window: 20
  rebalance_day: 1
  prep_cache_path: "experiments/.cache/v2_prep_cache.pkl"

scheduler:
  bar_interval_m: 15
  poll_offset_s: 5

telegram:
  enabled: false
  notify_on: [trade, error, daily]

db_path: "data/live/paper_binance.db"
log_level: "INFO"

strategies:
  s8_sym15:
    class: "live.strategies.s8_sym15.S8Sym15Strategy"
    enabled: true
    model_dir: "data/live/models"
    timeframes: ["15m", "1h", "3h", "4h", "24h"]
    holds: [2, 4, 16, 6, 12]
    breaker:
      type: "pnl_ratio_symmetric"
      window: 10
      threshold: -0.01
      floor: 0.10
      up_threshold: 0.01
      cap: 1.5
    s8:
      core: [BTC, ETH, XRP, ADA, LINK, LTC, BNB, BCH, ETC]
      max_total: 30
      btc_vol_window: 20
      prep_cache_path: "experiments/.cache/v2_prep_cache.pkl"
    portfolio:
      base_sizing_pct: 0.300
      max_signal_mult: 2.0
      max_dd: 0.10
      delever_start: 0.05
      max_per_asset: 0.25
      max_exposure: 0.90
      regime_exposure_floor: 0.50
    quote_currency: "USDT"
    vol_overlay:
      target_vol: 0.025
      floor: 0.3
      cap: 1.5
    signal_generator:
      conf_threshold: 0.08
      regime_ema_span: 20
      # Fail-safe (D3 fix): refuse to load models that lack a *_meta.json
      # sidecar with baked vol + conf thresholds. Any such model would
      # silently fall back to the hardcoded 0.08 conf filter and rolling
      # vol quantile (= the pre-fix divergent behaviour). When a new asset
      # enters the universe, ModelManager auto-queues a retrain that bakes
      # the metadata, then the model becomes loadable on the next reload.
      require_metadata: true
    # D6 fix: per-trade sizing guards (backtest drawdown_improvements.py:462-480)
    sizing_guards:
      participation_rate: 0.02      # cap position notional at 2% of daily volume
      guard_pct: 0.50               # 50% safety margin on max_profitable_size
      calibration_path: "data/execution_calibration.json"
      vip_tier_name: "VIP2"
      vip_maker_bps: 1.60
      vip_taker_bps: 3.75

max_signals_per_bar: 20

# Paper-execution slippage model (D6 parity fix).
# "calibrated" uses signal_engine.slippage.compute_slippage with per-symbol
# half-spread + sqrt impact + VIP2 maker/taker fees. Byte-identical to the
# backtest's paper-trade math. Use "flat_2bps" to revert to legacy behaviour.
execution:
  type: "calibrated"
  calibration_path: "data/execution_calibration.json"
  # $200K capital puts us at Bybit VIP2 (see src/signal_engine/execution.py:32-40)
  vip_tier_name: "VIP2"
  vip_maker_bps: 1.60
  vip_taker_bps: 3.75
  daily_vol_ttl_s: 3600

monitor:
  expected_maker_fill_rate: 0.77
  expected_spread_bps: 1.22
  expected_avg_cost_bps: 3.9
  fill_rate_drift_threshold: 0.10
  slippage_alert_bps: 5.0
  latency_p95_alert_ms: 65000

reconciler:
  stale_order_age_minutes: 5

data_validator:
  max_staleness_factor: 3.0
  max_gap_factor: 3.0
  min_bars: 30

vol_overlay:
  target_vol: 0.025
  floor: 0.3
  cap: 1.5

max_risk_per_trade: 0.03
sl_cap: 0.75
